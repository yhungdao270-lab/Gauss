        { id:25, type:"exercise", difficulty:"hard", text:"Giải hệ bằng Gauss: \(\begin{cases} x+2y+3z=14 \\ 2x+y+2z=10 \\ 3x+2y+z=10 \end{cases}\). Tìm z.", options:["1","2","3","4"], correct:0, explanation:"Khử: H2-2H1, H3-3H1, được hệ mới; tiếp tục khử, cuối cùng z=1.", tip:"🧮 Khử tuần tự, thế ngược." },
        { id:26, type:"exercise", difficulty:"hard", text:"Tìm m để hệ sau có vô số nghiệm: \(\begin{cases} x+y+z=1 \\ 2x+3y+4z=4 \\ 3x+4y+mz=5 \end{cases}\)", options:["m=5","m=6","m=7","m=8"], correct:0, explanation:"Khử, điều kiện để hạng A = hạng mở rộng < 3 → m=5.", tip:"🔢 Dùng Gauss tìm điều kiện." },
        { id:27, type:"exercise", difficulty:"hard", text:"Cho ma trận A vuông cấp 3. Sau khử Gauss, ma trận bậc thang có 3 pivot. Kết luận:", options:["A suy biến","A khả nghịch","Hệ Ax=0 có vô số nghiệm","det(A)=0"], correct:1, explanation:"3 pivot → hạng đầy → A khả nghịch, nghiệm duy nhất.", tip:"✅ Ma trận vuông hạng đầy thì khả nghịch." },
        { id:28, type:"exercise", difficulty:"hard", text:"Giải hệ \(\begin{cases} x_1+2x_2-x_3=2 \\ 2x_1+5x_2-2x_3=5 \\ -x_1-3x_2+2x_3=1 \end{cases}\). Nghiệm là:", options:["(1,0,1)","(0,1,1)","(1,1,0)","(2, -1,2)"], correct:0, explanation:"Khử Gauss → nghiệm (1,0,1).", tip:"💪 Kiểm tra lại bằng thế." },
        { id:29, type:"exercise", difficulty:"hard", text:"Số phép toán (phép nhân/chia) xấp xỉ của khử Gauss cho ma trận n×n là:", options:["O(n)","O(n²)","O(n³)","O(2ⁿ)"], correct:2, explanation:"Độ phức tạp tính toán của khử Gauss là O(n³) do các vòng lặp lồng nhau.", tip:"⏱️ Thuật toán bậc ba." }
    ];
    // Điều chỉnh lại câu 16 đã sửa, đảm bảo 30 phần tử
    if (questionsData.length !== 30) console.warn("Số câu không đúng 30!");

    let userAnswers = new Array(30).fill(null);

    function computeScore() {
        let correctCount = 0;
        for (let i = 0; i < questionsData.length; i++) {
            if (userAnswers[i] !== null && userAnswers[i] === questionsData[i].correct) {
                correctCount++;
            }
        }
        document.getElementById("scoreCount").innerText = correctCount;
    }

    async function refreshMath() {
        if (window.MathJax) await MathJax.typesetPromise();
    }

    async function applyFeedbackAndHighlight(qid) {
        const q = questionsData[qid];
        const selected = userAnswers[qid];
        const isCorrect = (selected !== null && selected === q.correct);
        const optionsDiv = document.getElementById(`options-${qid}`);
        if (optionsDiv) {
            const optionDivs = optionsDiv.querySelectorAll('.option');
            optionDivs.forEach((div, idx) => {
                div.classList.remove('correct-highlight', 'wrong-highlight');
                if (selected !== null && idx === selected) {
                    if (isCorrect) div.classList.add('correct-highlight');
                    else div.classList.add('wrong-highlight');
                }
            });
        }
        const feedbackDiv = document.getElementById(`feedback-${qid}`);
        if (selected !== null && feedbackDiv) {
            const correctLetter = String.fromCharCode(65 + q.correct);
            const correctAnswerText = q.options[q.correct];
            const statusText = isCorrect ? "✅ ĐÚNG!" : "❌ SAI!";
            feedbackDiv.style.display = "block";
            feedbackDiv.className = `feedback ${isCorrect ? 'feedback-correct' : 'feedback-wrong'}`;
            feedbackDiv.innerHTML = `
                <p><strong>${statusText}</strong> &nbsp; 📌 Đáp án đúng: ${correctLetter}. ${correctAnswerText}</p>
                <div class="explanation"><strong>📖 Giải thích:</strong> ${q.explanation}</div>
                <div class="tip"><strong>⚡ Mẹo nhanh:</strong> ${q.tip}</div>
            `;
            await refreshMath();
        } else if (feedbackDiv) feedbackDiv.style.display = "none";
    }

    async function handleAnswer(qid, selectedIdx) {
        userAnswers[qid] = selectedIdx;
        await applyFeedbackAndHighlight(qid);
        computeScore();
        await refreshMath();
    }

    async function renderQuestions() {
        const container = document.getElementById("questionsContainer");
        container.innerHTML = "";
        for (let idx = 0; idx < questionsData.length; idx++) {
            const q = questionsData[idx];
            const card = document.createElement("div");
            card.className = "question-card";
            const badgeType = q.type === "theory" ? "badge-theory" : "badge-exercise";
            const difficultyClass = q.difficulty === "easy" ? "badge-easy" : (q.difficulty === "medium" ? "badge-medium" : "badge-hard");
            const difficultyText = q.difficulty === "easy" ? "Dễ" : (q.difficulty === "medium" ? "Trung bình" : "Khó");
            const typeText = q.type === "theory" ? "📘 Lý thuyết" : "📝 Bài tập";
            card.innerHTML = `
                <div class="question-title">
                    <span class="badge ${badgeType}">${typeText}</span>
                    <span class="badge ${difficultyClass}">${difficultyText}</span>
                    <span style="font-weight:500;">Câu ${idx+1}</span>
                </div>
                <div class="question-text">${q.text}</div>
                <div class="options" id="options-${idx}"></div>
                <div class="feedback" id="feedback-${idx}" style="display:none;"></div>
            `;
            container.appendChild(card);
            const optionsDiv = document.getElementById(`options-${idx}`);
            q.options.forEach((opt, optIdx) => {
                const optionDiv = document.createElement("div");
                optionDiv.className = "option";
                const radioId = `q${idx}_opt${optIdx}`;
                optionDiv.innerHTML = `
                    <input type="radio" name="q${idx}" id="${radioId}" value="${optIdx}">
                    <label for="${radioId}" class="option-text">${opt}</label>
                `;
                optionsDiv.appendChild(optionDiv);
                const radio = optionDiv.querySelector('input');
                radio.addEventListener('change', async (e) => {
                    if (radio.checked) await handleAnswer(idx, optIdx);
                });
            });
            if (userAnswers[idx] !== null) {
                const radioToCheck = document.querySelector(`input[name="q${idx}"][value="${userAnswers[idx]}"]`);
                if (radioToCheck) radioToCheck.checked = true;
                await applyFeedbackAndHighlight(idx);
            }
        }
        await refreshMath();
        computeScore();
    }

    async function resetAll() {
        userAnswers.fill(null);
        for (let i = 0; i < questionsData.length; i++) {
            const radios = document.querySelectorAll(`input[name="q${i}"]`);
            radios.forEach(r => r.checked = false);
            const fb = document.getElementById(`feedback-${i}`);
            if (fb) fb.style.display = "none";
            const optsDiv = document.getElementById(`options-${i}`);
            if (optsDiv) {
                const opts = optsDiv.querySelectorAll('.option');
                opts.forEach(opt => opt.classList.remove('correct-highlight', 'wrong-highlight'));
            }
        }
        computeScore();
        await refreshMath();
    }

    window.addEventListener('DOMContentLoaded', async () => {
        await renderQuestions();
        document.getElementById("resetAllBtn").addEventListener("click", resetAll);
        document.getElementById("totalCount").innerText = questionsData.length;
    });
</script>
</body>
</html>
